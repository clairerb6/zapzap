name: Build Debian package

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            dpkg-dev \
            rsync \
            python3

      - name: Build .deb package
        run: ./_scripts/build-deb.sh

      - name: Validate declared runtime dependencies
        run: |
          DEB_FILE="$(ls -1 *.deb | head -n1)"
          DEPENDS="$(dpkg-deb -f "${DEB_FILE}" Depends)"

          echo "Checking dependencies from ${DEB_FILE}:"
          echo "${DEPENDS}"

          echo "${DEPENDS}" \
            | tr ',' '\n' \
            | sed -E 's/\(.*\)//g; s/\|.*//g; s/^[[:space:]]+//; s/[[:space:]]+$//' \
            | while read -r dep; do
                [ -n "${dep}" ] || continue
                echo "Validating ${dep}"
                apt-cache show "${dep}" >/dev/null
              done

      # 🧪 Siempre subimos artifact (PRs, pushes, tags)
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: zapzap-deb
          path: "*.deb"

      # 🚀 Solo en tags se sube al Release
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
