name: Build RPM package

on:
  workflow_dispatch:

  release:
    types: [created]

  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install COPR client
        run: |
          python -m pip install --upgrade pip
          pip install copr

      - name: Configure COPR
        run: |
          mkdir -p ~/.config
          echo "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}

      - name: Submit RPM build to COPR
        env:
          VERSION: ${{ github.ref_name }}
          COPR_USERNAME: ${{ vars.COPR_USERNAME || github.repository_owner }}
          COPR_PROJECT: ${{ vars.COPR_PROJECT || 'zapzap' }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          CREATE_RELEASE: "false"
        run: |
          python builders/copr_builder.py
